# k8s/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: express-app
  template:
    metadata:
      labels:
        app: express-app
    spec:
      containers:
        - name: express-app
          image: 977952712667.dkr.ecr.eu-central-1.amazonaws.com/express-app-repo:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "128Mi"   # Minimum memory guaranteed
              cpu: "250m"       # Minimum CPU guaranteed
            limits:
              memory: "256Mi"   # Maximum memory allowed
              cpu: "500m"       # Maximum CPU allowed
        
