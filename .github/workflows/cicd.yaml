name: Build and Deploy via GitOps

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/simpleweb

jobs:
  build-wf:
    name: Build, test and push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG .
          docker push $IMAGE_NAME:$IMAGE_TAG

  deploy-wf:
    name: Update fleet-infra-flux (GitOps)
    runs-on: ubuntu-latest
    needs: build-wf

    steps:
      - name: Test Flux repository access
        env:
          GH_TOKEN: ${{ secrets.FLUX_REPO_TOKEN }}
        run: |
          gh api repos/belayfitsum/fleet-infra-flux \
             --jq '{name: .name, private: .private, default_branch: .default_branch}'
      - name: Checkout fleet-infra-flux
        uses: actions/checkout@v4
        with:
          repository: belayfitsum/fleet-infra-flux
          token: ${{ secrets.FLUX_REPO_TOKEN }}
          path: fleet-infra-flux

      - name: Update image tag in fleet-infra-flux
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd fleet-infra-flux
          sed -i "s|image:.*|image: $IMAGE_NAME:$IMAGE_TAG|" \
            clusters/apps/base/express/deployment.yaml

      - name: Commit and push to fleet-infra-flux
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd fleet-infra-flux
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add clusters/apps/base/express/deployment.yaml
          git commit -m "bump image to $IMAGE_TAG"
          git push
