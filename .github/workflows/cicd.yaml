name: Build and deploy to Eks

on:
  push:
    branches:
      - main
  pull_request:

# This workflow has only two jobs [infra preparation and image building- pushing to ecr]. Deploy to Kubernetes job is on its way.
# Notes: OpenIDConnect OIDC can be used to authenticate github to use aws resources instead of using aws access keys.

jobs:
  terraform-infra-wf:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install Terraform
      uses: hashicorp/setup-terraform@v2

    - name: Configure AWS CLI
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}


    - name: Initialize Terraform
      run: terraform init

    - name: Validate Terraform
      run: terraform validate

    - name: Format terraform
      run: terraform fmt -check
      continue-on-error: true

    - name: Apply Terraform Changes
      # env:
      #   AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #   AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: terraform apply -auto-approve


  build-wf:
    name: Build, tag and push to Amazon ECR
    runs-on: ubuntu-latest # configuring the runner which executes my jobs
    needs: terraform-infra-wf
    env:
    # IMAGE_TAG: ${{ github.sha }} // keep this and use another image tag for simplicity
      IMAGE_TAG: latest
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
      REGISTRY: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v3 # telling the runner to use this action to copy my code to the runner file system

      - name: Install kubectl
        uses: azure/setup-kubectl@v2.0
        id: install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'false'

      - name: Build Docker image # using the git commit sha as an image tag
        run: |
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Push Docker image to ECR # login to the docker CLI inside the runner
        run: |
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update kube config
        run: aws eks update-kubeconfig --name express-app-repo

      - name : Deploy to Eks
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml

